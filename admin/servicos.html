<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicos - Admin Epic Sana</title>
    <link rel="icon" href="../assets/image/favicon.png" type="image/png">
    <link rel="stylesheet" href="../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-header"><a href="dashboard.html"><img src="../assets/image/Logo.png" alt="Epic Sana"></a></div>
    <div class="sidebar-menu">
        <ul>
            <li><a href="dashboard.html"><i class="fa fa-desktop"></i><span>Dashboard</span></a></li>
            <li><a href="reservas.html"><i class="fa fa-calendar-check-o"></i><span>Reservas</span></a></li>
            <li><a href="utentes.html"><i class="fa fa-users"></i><span>Utentes &amp; Recepcionistas</span></a></li>
            <li class="active"><a href="servicos.html"><i class="fa fa-bed"></i><span>Servicos &amp; Quartos</span></a></li>
            <li><a href="relatorios.html"><i class="fa fa-bar-chart"></i><span>Relatorios</span></a></li>
        </ul>
    </div>
    <div class="sidebar-footer"><button class="btn-logout" onclick="logout()"><i class="fa fa-sign-out"></i> Sair</button></div>
</aside>
<main class="main-content">
    <header class="top-header">
        <div class="page-title"><h4>Gestao de Servicos</h4></div>
        <div class="user-profile">
            <div class="user-info"><span class="name user-name-display">Admin</span><span class="role user-role-display">ADMIN</span></div>
            <div class="user-avatar"><img src="../assets/image/img/user.png" alt="Admin"></div>
        </div>
    </header>
    <div class="content-wrapper">
        <div class="card-table mb-4">
            <div class="table-header d-flex justify-content-between align-items-center">
                <h5 class="m-0 font-weight-bold" style="color:#04091e;">Quartos, Mesas e Servicos</h5>
                <button class="btn btn-primary btn-sm" onclick="prepareNew()" data-toggle="modal" data-target="#servicoModal">
                    <i class="fa fa-plus"></i> Novo Servico
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>TIPO DE SERVICO</th>
                            <th>DESCRICAO</th>
                            <th>PRECO/NOITE (KZ)</th>
                            <th>STATUS</th>
                            <th class="text-center">ACOES</th>
                        </tr>
                    </thead>
                    <tbody id="servicosBody">
                        <tr><td colspan="6" class="text-center py-4"><i class="fa fa-spinner fa-spin"></i> A carregar...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- Modal Servico -->
<div class="modal fade" id="servicoModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content" style="border-radius:14px;border:none;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title font-weight-bold" id="servicoModalTitle" style="color:#04091e;">Novo Servico</h5>
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
            </div>
            <div class="modal-body">
                <form id="formServico">
                    <input type="hidden" id="svc_id">
                    <div class="form-group">
                        <label class="font-weight-bold" style="font-size:12px;">TIPO DE SERVICO</label>
                        <input type="text" class="form-control" id="svc_tipo" required placeholder="Ex: Quarto Deluxe, Mesa VIP, Carro...">
                    </div>
                    <div class="form-group">
                        <label class="font-weight-bold" style="font-size:12px;">DESCRICAO</label>
                        <textarea class="form-control" id="svc_desc" rows="2" required placeholder="Descricao breve do servico"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="font-weight-bold" style="font-size:12px;">PRECO POR NOITE/USO (KZ)</label>
                        <input type="number" class="form-control" id="svc_preco" min="0" step="100" required placeholder="0">
                    </div>
                    <div class="form-group">
                        <label class="font-weight-bold" style="font-size:12px;">STATUS</label>
                        <select class="form-control" id="svc_status">
                            <option value="desocupado">Desocupado (disponivel)</option>
                            <option value="ocupado">Ocupado (indisponivel)</option>
                        </select>
                    </div>
                    <div class="text-right mt-4">
                        <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="../assets/js/jquery-3.2.1.min.js"></script>
<script src="../assets/js/bootstrap.min.js"></script>
<script src="../assets/js/notify.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
var allServicos = [];

$(function() { loadServicos(); });

async function loadServicos() {
    try {
        var res = await fetch('/tcc_project/api/admin/servicos.php');
        allServicos = await res.json();
        if (!Array.isArray(allServicos) || allServicos.length === 0) {
            $('#servicosBody').html('<tr><td colspan="6" class="text-center py-4 text-muted">Nenhum servico cadastrado.</td></tr>');
            return;
        }
        var html = '';
        allServicos.forEach(function(s) {
            var idKey = s['id_servi\u00e7o'] || s.id_servico || s.id;
            var tipo  = s.tipos_servicos || '--';
            var desc  = s['descri\u00e7\u00e3o'] || s.descricao || '--';
            var preco = s['pre\u00e7o'] || s.preco || 0;
            var status = s.status || 'desocupado';
            var statusBadge = status === 'desocupado'
                ? '<span class="badge" style="background:#28a745;color:#fff;padding:4px 10px;border-radius:20px;">Disponivel</span>'
                : '<span class="badge" style="background:#dc3545;color:#fff;padding:4px 10px;border-radius:20px;">Ocupado</span>';
            var toggleLabel = status === 'desocupado' ? 'Marcar Ocupado' : 'Marcar Livre';
            var toggleStatus = status === 'desocupado' ? 'ocupado' : 'desocupado';
            html += '<tr>' +
                '<td><strong>#' + idKey + '</strong></td>' +
                '<td><strong>' + tipo + '</strong></td>' +
                '<td>' + desc + '</td>' +
                '<td>KZ ' + parseFloat(preco).toLocaleString('pt-PT') + '</td>' +
                '<td>' + statusBadge + '</td>' +
                '<td class="text-center">' +
                '<button class="btn btn-sm btn-outline-primary edit-svc-btn" data-id="' + idKey + '" data-toggle="modal" data-target="#servicoModal"><i class="fa fa-edit"></i></button>' +
                ' <button class="btn btn-sm btn-outline-warning toggle-svc-btn ml-1" data-id="' + idKey + '" data-status="' + toggleStatus + '" title="' + toggleLabel + '"><i class="fa fa-toggle-on"></i></button>' +
                ' <button class="btn btn-sm btn-outline-danger del-svc-btn ml-1" data-id="' + idKey + '"><i class="fa fa-trash"></i></button>' +
                '</td></tr>';
        });
        $('#servicosBody').html(html);
        bindServiceActions();
    } catch(e) {
        console.error(e);
        $('#servicosBody').html('<tr><td colspan="6" class="text-center text-danger">Erro ao carregar.</td></tr>');
    }
}

function bindServiceActions() {
    $('.edit-svc-btn').on('click', function() {
        var id = $(this).data('id');
        var s  = allServicos.find(function(x){ return (x['id_servi\u00e7o'] || x.id_servico || x.id) == id; });
        if (s) {
            $('#servicoModalTitle').text('Editar Servico');
            $('#svc_id').val(id);
            $('#svc_tipo').val(s.tipos_servicos || '');
            $('#svc_desc').val(s['descri\u00e7\u00e3o'] || s.descricao || '');
            $('#svc_preco').val(s['pre\u00e7o'] || s.preco || 0);
            $('#svc_status').val(s.status || 'desocupado');
        }
    });

    $('.toggle-svc-btn').on('click', async function() {
        var id     = $(this).data('id');
        var status = $(this).data('status');
        var s = allServicos.find(function(x){ return (x['id_servi\u00e7o'] || x.id_servico || x.id) == id; });
        if (!s) return;
        try {
            var res = await fetch('/tcc_project/api/admin/servicos.php', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id_servico: id,
                    tipos_servicos: s.tipos_servicos,
                    descricao: s['descri\u00e7\u00e3o'] || s.descricao || '',
                    preco: s['pre\u00e7o'] || s.preco || 0,
                    status: status
                })
            });
            var data = await res.json();
            if (res.ok) { notify.success(data.message || 'Status actualizado.'); loadServicos(); }
            else { notify.error(data.message || 'Erro.'); }
        } catch(e) { notify.error('Erro de ligacao.'); }
    });

    $('.del-svc-btn').on('click', async function() {
        var id = $(this).data('id');
        if (!confirm('Eliminar este servico? Pode afectar reservas existentes.')) return;
        try {
            var res = await fetch('/tcc_project/api/admin/servicos.php?id=' + id, { method: 'DELETE' });
            var data = await res.json();
            if (res.ok) { notify.success(data.message || 'Eliminado.'); loadServicos(); }
            else { notify.error(data.message || 'Erro.'); }
        } catch(e) { notify.error('Erro de ligacao.'); }
    });
}

window.prepareNew = function() {
    $('#servicoModalTitle').text('Novo Servico');
    $('#formServico')[0].reset();
    $('#svc_id').val('');
};

$('#formServico').on('submit', async function(e) {
    e.preventDefault();
    var id    = $('#svc_id').val();
    var tipo  = $('#svc_tipo').val().trim();
    var desc  = $('#svc_desc').val().trim();
    var preco = parseFloat($('#svc_preco').val());
    var status = $('#svc_status').val();
    var method = id ? 'PUT' : 'POST';
    var payload = { tipos_servicos: tipo, descricao: desc, preco: preco, status: status };
    if (id) payload.id_servico = id;
    try {
        var res = await fetch('/tcc_project/api/admin/servicos.php', {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        var data = await res.json();
        if (res.ok) { notify.success(data.message || 'Guardado.'); $('#servicoModal').modal('hide'); loadServicos(); }
        else { notify.error(data.message || 'Erro.'); }
    } catch(e) { notify.error('Erro de ligacao.'); }
});
</script>
</body>
</html>
