<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Reservas - Epic Sana Luanda</title>
    <link rel="icon" href="../assets/image/favicon.png" type="image/png">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="../index.html">
                <img src="../assets/image/Logo.png" alt="Epic Sana">
            </a>
        </div>
        <div class="sidebar-menu">
            <ul>
                <li>
                    <a href="index.html">
                        <i class="fa fa-home"></i>
                        <span>Início</span>
                    </a>
                </li>
                <li class="active">
                    <a href="minhas-reservas.html">
                        <i class="fa fa-calendar-check-o"></i>
                        <span>Minhas Reservas</span>
                    </a>
                </li>
                <li>
                    <a href="nova-reserva.html">
                        <i class="fa fa-plus-circle"></i>
                        <span>Nova Reserva</span>
                    </a>
                </li>
                <li>
                    <a href="mensagens.html">
                        <i class="fa fa-comments-o"></i>
                        <span>Mensagens</span>
                    </a>
                </li>
                <li>
                    <a href="perfil.html">
                        <i class="fa fa-user-circle-o"></i>
                        <span>Meu Perfil</span>
                    </a>
                </li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <button class="btn-logout">
                <i class="fa fa-sign-out"></i> Sair
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-header">
            <div class="page-title">
                <h4>Minhas Reservas</h4>
            </div>
            <div class="user-profile">
                <div class="user-info">
                    <span class="name user-name-display">Nome do Usuário</span>
                    <span class="role user-role-display">Papel</span>
                </div>
                <div class="user-avatar">
                    <img src="../assets/image/img/user.png" alt="Utente">
                </div>
            </div>
        </header>

        <div class="content-wrapper">
            <div class="card-table">
                <div class="table-header">
                    <h5>Histórico de Reservas</h5>
                    <a href="nova-reserva.html" class="btn btn-sm" style="background: #d4ab04; color: white;"><i class="fa fa-plus"></i> Nova Reserva</a>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Ref ID</th>
                                <th>Serviço</th>
                                <th>Check-in</th>
                                <th>Check-out</th>
                                <th>Preço Total</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="reservas-table-body">
                            <tr>
                                <td colspan="7" class="text-center">Carregando reservas...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- JS -->
    <script src="../assets/js/jquery-3.2.1.min.js"></script>
    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/notify.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/dashboard.js"></script>
    <script src="../assets/js/utente-reservas.js"></script>
</body>
</html>
