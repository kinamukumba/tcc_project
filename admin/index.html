<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo - Epic Sana Luanda</title>
    <link rel="icon" href="../assets/image/favicon.png" type="image/png">
    <link rel="stylesheet" href="../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #04091e 0%, #0a1540 60%, #04091e 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        /* Animated background dots */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(212,171,4,0.05) 0%, transparent 60%);
            animation: pulse 8s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        .login-wrapper {
            display: flex;
            width: 100%;
            max-width: 900px;
            min-height: 520px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            position: relative;
            z-index: 1;
        }
        /* Left panel */
        .login-brand {
            flex: 1;
            background: linear-gradient(160deg, #d4ab04 0%, #f3c300 50%, #a07900 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 40px;
            text-align: center;
        }
        .login-brand img {
            height: 70px;
            margin-bottom: 30px;
            filter: brightness(0) invert(1);
        }
        .login-brand h2 {
            color: #fff;
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        .login-brand p {
            color: rgba(255,255,255,0.8);
            font-size: 13px;
            line-height: 1.6;
        }
        .brand-badge {
            margin-top: 30px;
            background: rgba(255,255,255,0.2);
            border-radius: 50px;
            padding: 8px 20px;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        /* Right panel */
        .login-form-panel {
            flex: 1;
            background: #060d26;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px 45px;
        }
        .login-form-panel h4 {
            color: #fff;
            font-weight: 700;
            font-size: 22px;
            margin-bottom: 8px;
        }
        .login-form-panel p.subtitle {
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            margin-bottom: 35px;
        }
        .form-group {
            margin-bottom: 22px;
            position: relative;
        }
        .form-group label {
            display: block;
            color: rgba(255,255,255,0.5);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.25);
            font-size: 14px;
        }
        .form-control {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 13px 15px 13px 42px;
            color: #fff;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
            outline: none;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.08);
            border-color: #d4ab04;
            box-shadow: 0 0 0 3px rgba(212,171,4,0.15);
        }
        .form-control::placeholder { color: rgba(255,255,255,0.2); }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #d4ab04, #f3c300);
            border: none;
            border-radius: 12px;
            color: #04091e;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
            font-family: 'Poppins', sans-serif;
        }
        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212,171,4,0.4);
        }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert-msg {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .alert-msg.error { background: rgba(220,53,69,0.15); border: 1px solid rgba(220,53,69,0.3); color: #ff6b7a; }
        .alert-msg.success { background: rgba(40,167,69,0.15); border: 1px solid rgba(40,167,69,0.3); color: #69e08c; }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            font-size: 12px;
            transition: 0.3s;
        }
        .back-link:hover { color: #d4ab04; }
        @media (max-width: 650px) {
            .login-brand { display: none; }
            .login-form-panel { padding: 40px 30px; }
            .login-wrapper { border-radius: 0; min-height: 100vh; }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- Brand Panel -->
        <div class="login-brand">
            <img src="../assets/image/Logo.png" alt="Epic Sana Luanda">
            <h2>Painel de Gestão</h2>
            <p>Área restrita para administradores e gestores do sistema Epic Sana Luanda.</p>
            <div class="brand-badge">Acesso Restrito</div>
        </div>

        <!-- Form Panel -->
        <div class="login-form-panel">
            <h4>Bem-vindo de volta</h4>
            <p class="subtitle">Insira as suas credenciais para aceder ao painel.</p>

            <div id="alertMsg" class="alert-msg"></div>

            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label>Endereço de E-mail</label>
                    <div class="input-wrap">
                        <i class="fa fa-envelope-o"></i>
                        <input type="email" id="email" class="form-control" placeholder="admin@sana.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Senha de Acesso</label>
                    <div class="input-wrap">
                        <i class="fa fa-lock"></i>
                        <input type="password" id="senha" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="btnLogin">
                    <i class="fa fa-sign-in"></i> &nbsp;Entrar no Painel
                </button>
            </form>

            <a href="../index.html" class="back-link">
                <i class="fa fa-arrow-left"></i> Voltar ao site principal
            </a>
        </div>
    </div>

    <script>
        // Se já estiver autenticado, redireciona diretamente
        (async function checkExistingSession() {
            try {
                const res = await fetch('/tcc_project/api/auth/session.php');
                if (res.ok) {
                    const data = await res.json();
                    if (data.authenticated) {
                        redirectByRole(data.user.role);
                    }
                }
            } catch(e) {}
        })();

        function redirectByRole(role) {
            if (role === 'admin') {
                window.location.href = '/tcc_project/admin/dashboard.html';
            } else if (role === 'gerente') {
                window.location.href = '/tcc_project/gerente/index.html';
            } else if (role === 'recepcionista') {
                window.location.href = '/tcc_project/recepcionista/index.html';
            } else if (role === 'utente') {
                window.location.href = '/tcc_project/utente/index.html';
            } else {
                window.location.href = '/tcc_project/admin/dashboard.html';
            }
        }

        function showAlert(msg, type) {
            var el = document.getElementById('alertMsg');
            el.className = 'alert-msg ' + type;
            el.innerHTML = '<i class="fa fa-' + (type === 'error' ? 'exclamation-circle' : 'check-circle') + '"></i> ' + msg;
            el.style.display = 'block';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var btn = document.getElementById('btnLogin');
            var email = document.getElementById('email').value.trim();
            var senha = document.getElementById('senha').value;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> &nbsp;A verificar...';

            try {
                const res = await fetch('/tcc_project/api/auth/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, senha: senha })
                });
                const data = await res.json();

                if (res.ok && data.user) {
                    showAlert('Login realizado com sucesso! A redirecionar...', 'success');
                    setTimeout(function() {
                        redirectByRole(data.user.role);
                    }, 800);
                } else {
                    showAlert(data.message || 'Credenciais inválidas.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa fa-sign-in"></i> &nbsp;Entrar no Painel';
                }
            } catch(err) {
                showAlert('Erro de conexão. Verifique se o servidor está ativo.', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa fa-sign-in"></i> &nbsp;Entrar no Painel';
            }
        });
    </script>
</body>
</html>
