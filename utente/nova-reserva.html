<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Reserva - Epic Sana Luanda</title>
    <link rel="icon" href="../assets/image/favicon.png" type="image/png">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="../index.html">
                <img src="../assets/image/Logo.png" alt="Epic Sana">
            </a>
        </div>
        <div class="sidebar-menu">
            <ul>
                <li>
                    <a href="index.html">
                        <i class="fa fa-home"></i>
                        <span>Início</span>
                    </a>
                </li>
                <li>
                    <a href="minhas-reservas.html">
                        <i class="fa fa-calendar-check-o"></i>
                        <span>Minhas Reservas</span>
                    </a>
                </li>
                <li class="active">
                    <a href="nova-reserva.html">
                        <i class="fa fa-plus-circle"></i>
                        <span>Nova Reserva</span>
                    </a>
                </li>
                <li>
                    <a href="mensagens.html">
                        <i class="fa fa-comments-o"></i>
                        <span>Mensagens</span>
                    </a>
                </li>
                <li>
                    <a href="perfil.html">
                        <i class="fa fa-user-circle-o"></i>
                        <span>Meu Perfil</span>
                    </a>
                </li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <button class="btn-logout">
                <i class="fa fa-sign-out"></i> Sair
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-header">
            <div class="page-title">
                <h4>Nova Reserva</h4>
            </div>
            <div class="user-profile">
                <div class="user-info">
                    <span class="name user-name-display">Nome do Usuário</span>
                    <span class="role user-role-display">Papel</span>
                </div>
                <div class="user-avatar">
                    <img src="../assets/image/img/user.png" alt="Utente">
                </div>
            </div>
        </header>

        <div class="content-wrapper">
            <div class="card-form">
                <div class="form-header">
                    <h5>Detalhes da Reserva</h5>
                </div>
                <form id="internalBookingForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Data de Início</label>
                            <input type="date" class="form-control" name="arrival" id="arrivalDate" required />
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Data de Término</label>
                            <input type="date" class="form-control" name="departure" id="departureDate" required />
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Serviço Desejado</label>
                            <select class="form-control" name="id_servico" id="serviceSelect" required>
                                <option value="">Carregando serviços...</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label>Adultos</label>
                            <select class="form-control" name="adults">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label>Crianças</label>
                            <select class="form-control" name="children">
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                            </select>
                        </div>
                    </div>
                    
                    <div id="booking-summary" class="mt-4">
                        <p class="text-muted small text-center py-3">Selecione as datas e o serviço para ver o resumo do pagamento.</p>
                    </div>

                    <div class="text-right mt-4">
                        <button type="submit" class="btn" style="background: #d4ab04; color: white; padding: 12px 40px;">Confirmar Reserva</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- JS -->
    <script src="../assets/js/jquery-3.2.1.min.js"></script>
    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/notify.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/dashboard.js"></script>
    <script src="../assets/js/utente-nova-reserva.js"></script>
</body>
</html>
