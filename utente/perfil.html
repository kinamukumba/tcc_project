<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Epic Sana Luanda</title>
    <link rel="icon" href="../assets/image/favicon.png" type="image/png">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="../index.html">
                <img src="../assets/image/Logo.png" alt="Epic Sana">
            </a>
        </div>
        <div class="sidebar-menu">
            <ul>
                <li><a href="index.html"><i class="fa fa-home"></i><span>Início</span></a></li>
                <li><a href="minhas-reservas.html"><i class="fa fa-calendar-check-o"></i><span>Minhas Reservas</span></a></li>
                <li><a href="nova-reserva.html"><i class="fa fa-plus-circle"></i><span>Nova Reserva</span></a></li>
                <li><a href="mensagens.html"><i class="fa fa-comments-o"></i><span>Mensagens</span></a></li>
                <li class="active"><a href="perfil.html"><i class="fa fa-user-circle-o"></i><span>Meu Perfil</span></a></li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <button class="btn-logout">
                <i class="fa fa-sign-out"></i> Sair
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-header">
            <div class="page-title"><h4>Configurações de Perfil</h4></div>
            <div class="user-profile">
                <div class="user-avatar">
                    <img src="../assets/image/img/user.png" alt="Utente">
                </div>
            </div>
        </header>

        <div class="content-wrapper">
            <div class="row">
                <div class="col-lg-4">
                    <div class="card-table text-center" style="padding: 30px;">
                        <img src="../assets/image/img/user.png" class="rounded-circle mb-3" style="width: 100px; border: 3px solid #d4ab04;">
                        <h5 class="mb-1" id="profile-name-display">Carregando...</h5>
                        <p class="text-muted">Utente Registrado</p>
                        <hr>
                        <div class="text-left">
                            <p><small class="text-muted d-block">Membro desde:</small> <span id="profile-member-since">-</span></p>
                            <p><small class="text-muted d-block">Total de Estadias:</small> <span id="profile-total-stays">0</span></p>
                        </div>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="card-table" style="padding: 30px;">
                        <h5 class="mb-4">Informações Pessoais</h5>
                        <form id="form-perfil">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label>Nome</label>
                                    <input type="text" class="form-control" name="nome" id="input-nome">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label>Sobrenome</label>
                                    <input type="text" class="form-control" name="sobrenome" id="input-sobrenome">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label>Email</label>
                                    <input type="email" class="form-control" name="email" id="input-email">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label>Telefone</label>
                                    <input type="text" class="form-control" name="telemovel" id="input-telefone">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label>BI</label>
                                    <input type="text" class="form-control" name="bi" id="input-bi" readonly title="Entre em contato com suporte para alterar o BI">
                                </div>
                            </div>
                            <hr>
                            <h5 class="mb-4">Alterar Senha (Opcional)</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label>Senha Atual</label>
                                    <input type="password" class="form-control" name="senha_atual" id="input-senha-atual">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label>Nova Senha</label>
                                    <input type="password" class="form-control" name="nova_senha" id="input-nova-senha">
                                </div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mt-3">
                                <button type="button" class="btn btn-outline-danger btn-sm" id="btn-delete-account">
                                    <i class="fa fa-trash"></i> Eliminar Minha Conta
                                </button>
                                <button type="submit" class="btn" style="background: #d4ab04; color: white; padding: 10px 30px;">Salvar Alterações</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- JS -->
    <script src="../assets/js/jquery-3.2.1.min.js"></script>
    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/notify.js"></script>    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/dashboard.js"></script>
    <script src="../assets/js/utente-perfil.js"></script>
</body>
</html>
